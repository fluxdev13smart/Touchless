<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<title>Roadie</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></symbol>
<symbol id="i-next" viewBox="0 0 24 24"><path d="M6 6l8.5 6L6 18zM16 6h2.2v12H16z"/></symbol>
<symbol id="i-prev" viewBox="0 0 24 24"><path d="M18 6l-8.5 6L18 18zM5.8 6H8v12H5.8z"/></symbol>
<symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/></symbol>
<symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
<symbol id="i-repeat1" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/><path d="M11 10h1v4"/></symbol>
<symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-eq" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h10M18 18h2"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/></symbol>
<symbol id="i-album" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="i-artist" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
<symbol id="i-genre" viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></symbol>
<symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h12M4 12h12M4 18h7"/><path d="M19 15v6M16 18h6"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-8-4.8-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 6.2-8 11-8 11z"/></symbol>
<symbol id="i-queue" viewBox="0 0 24 24"><path d="M3 6h13M3 12h13M3 18h8"/><path d="m17 14 5 3-5 3z"/></symbol>
<symbol id="i-lyrics" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/></symbol>
<symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5z"/></symbol>
<symbol id="i-speed" viewBox="0 0 24 24"><path d="M4 18a9 9 0 1 1 16 0"/><path d="m12 14 4-5"/></symbol>
<symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
<symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></symbol>
<symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M18 6l-2.5 2.5M8.5 15.5 6 18"/></symbol>
<symbol id="i-look" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2.5"/><path d="m21 16-5-4-8 8"/></symbol>
<symbol id="i-viz" viewBox="0 0 24 24"><path d="M4 14v4M8 8v10M12 4v14M16 10v8M20 13v5"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
<symbol id="i-next1" viewBox="0 0 24 24"><path d="M5 5v14l8-7zM15 6h4M15 12h4M15 18h4"/></symbol>
</defs></svg>

<div id="app">
  <nav id="rail" class="panel" aria-label="Library">
    <button class="nav" data-tab="home" aria-current="true"><i><svg class="ic"><use href="#i-home"/></svg></i>For you</button>
    <button class="nav" data-tab="folders"><i><svg class="ic"><use href="#i-folder"/></svg></i>Folders</button>
    <button class="nav" data-tab="songs"><i><svg class="ic"><use href="#i-note"/></svg></i>Songs</button>
    <button class="nav" data-tab="albums"><i><svg class="ic"><use href="#i-album"/></svg></i>Albums</button>
    <button class="nav" data-tab="artists"><i><svg class="ic"><use href="#i-artist"/></svg></i>Artists</button>
    <button class="nav" data-tab="genres"><i><svg class="ic"><use href="#i-genre"/></svg></i>Genres</button>
    <button class="nav" data-tab="playlists"><i><svg class="ic"><use href="#i-list"/></svg></i>Playlists</button>
    <button class="nav end" data-act="settings"><i><svg class="ic"><use href="#i-gear"/></svg></i>Settings</button>
  </nav>

  <main id="main" class="panel">
    <div id="tint"></div>
    <header id="head">
      <button class="rb" id="back" aria-label="Back" hidden><svg class="ic"><use href="#i-back"/></svg></button>
      <div class="ttl"><p id="hSub">Library</p><h1 id="hTitle">For you</h1><p id="status" aria-live="polite"></p></div>
      <div class="hact">
        <span id="hExtra" class="hact"></span>
        <label class="search" id="searchBox"><svg class="ic"><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search your music" aria-label="Search your music" autocomplete="off"><button type="button" id="qClear" aria-label="Clear search"><svg class="ic"><use href="#i-x"/></svg></button></label>
      </div>
    </header>
    <div id="view"></div>
  </main>

  <footer id="bar" class="panel bar">
    <button class="b-info" data-act="np" aria-label="Open now playing">
      <span class="b-art" id="barArt"><span class="ph" style="--h:260"><svg class="ic"><use href="#i-note"/></svg></span></span>
      <span class="b-txt"><b id="barTitle">Nothing playing</b><small id="barArtist">Pick a song to start</small></span>
    </button>
    <div class="b-mid">
      <div class="ctrls">
        <button class="cb" data-act="shuffle" aria-pressed="false" aria-label="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="cb main pv" data-act="prev" aria-label="Previous song"><svg class="ic f"><use href="#i-prev"/></svg></button>
        <button class="cb play" data-act="play" aria-label="Play"><svg class="ic f"><use href="#i-play"/></svg></button>
        <button class="cb main nx" data-act="next" aria-label="Next song"><svg class="ic f"><use href="#i-next"/></svg></button>
        <button class="cb" data-act="repeat" aria-pressed="false" aria-label="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="b-prog"><span id="bT1">0:00</span>
        <div class="scrub" id="barScrub" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100"><i class="fill"></i><b class="knob"></b></div>
        <span id="bT2">0:00</span></div>
    </div>
    <div class="b-right">
      <button class="ib fav" data-act="fav" aria-pressed="false" aria-label="Favourite"><svg class="ic"><use href="#i-heart"/></svg></button>
      <button class="ib" data-act="queue" aria-label="Playing queue"><svg class="ic"><use href="#i-queue"/></svg></button>
      <button class="ib" data-act="eq" aria-label="Equalizer"><svg class="ic"><use href="#i-eq"/></svg></button>
      <div class="vol"><svg class="ic"><use href="#i-vol"/></svg><div class="scrub" id="barVol" role="slider" tabindex="0" aria-label="Volume"><i class="fill"></i><b class="knob"></b></div></div>
    </div>
  </footer>
</div>

<section id="np" class="sheet s-blur" hidden aria-label="Now playing">
  <div id="npbgw"><div id="npbg"></div></div>
  <div class="shade"></div>
  <canvas id="viz" aria-hidden="true"></canvas>
  <div class="grab" id="npGrab"><span></span></div>
  <header class="np-top">
    <button class="rb" data-act="npclose" aria-label="Close now playing"><svg class="ic"><use href="#i-down"/></svg></button>
    <div class="np-from"><small>Playing from</small><b id="npFrom">All songs</b></div>
    <div class="np-tools">
      <button class="rb" id="btnLyr" data-act="lyrics" aria-pressed="false" aria-label="Lyrics"><svg class="ic"><use href="#i-lyrics"/></svg></button>
      <button class="rb" data-act="queue" aria-label="Playing queue"><svg class="ic"><use href="#i-queue"/></svg></button>
      <button class="rb" data-act="eq" aria-label="Equalizer"><svg class="ic"><use href="#i-eq"/></svg></button>
      <button class="rb" data-act="npmore" aria-label="More"><svg class="ic"><use href="#i-more"/></svg><span class="dot" id="sleepDot" hidden></span></button>
    </div>
  </header>
  <div class="np-body">
    <div class="np-left">
      <div id="stage"><div id="pulse"></div>
        <svg id="ring" viewBox="0 0 100 100" aria-hidden="true"><circle id="ringBg" cx="50" cy="50" r="46"/><circle id="ringFg" cx="50" cy="50" r="46" stroke-dasharray="289.03" stroke-dashoffset="289.03"/></svg>
      </div>
      <div id="lyr" aria-label="Lyrics"></div>
    </div>
    <div class="np-info">
      <div class="np-title">
        <div class="np-text"><h2 id="npTitle">Nothing playing</h2><p id="npArtist"></p><p id="npAlbum"></p></div>
        <button class="ib fav" data-act="fav" aria-pressed="false" aria-label="Favourite"><svg class="ic"><use href="#i-heart"/></svg></button>
      </div>
      <div>
        <div class="scrub" id="npScrub" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100"><i class="fill"></i><b class="knob"></b></div>
        <div class="times"><span id="npT1">0:00</span><span id="npT2">0:00</span></div>
      </div>
      <div class="ctrls">
        <button class="cb" data-act="shuffle" aria-pressed="false" aria-label="Shuffle"><svg class="ic"><use href="#i-shuffle"/></svg></button>
        <button class="cb main" data-act="prev" aria-label="Previous song"><svg class="ic f"><use href="#i-prev"/></svg></button>
        <button class="cb play" data-act="play" aria-label="Play"><svg class="ic f"><use href="#i-play"/></svg></button>
        <button class="cb main" data-act="next" aria-label="Next song"><svg class="ic f"><use href="#i-next"/></svg></button>
        <button class="cb" data-act="repeat" aria-pressed="false" aria-label="Repeat"><svg class="ic"><use href="#i-repeat"/></svg></button>
      </div>
      <div class="np-vol"><svg class="ic"><use href="#i-vol"/></svg><div class="scrub" id="npVol" role="slider" tabindex="0" aria-label="Volume"><i class="fill"></i><b class="knob"></b></div></div>
    </div>
  </div>
</section>

<section id="qs" class="sheet" hidden aria-label="Playing queue">
  <div class="grab" id="qGrab"><span></span></div>
  <div class="sh-wrap">
    <div class="sh-head">
      <div><h2>Playing queue</h2><p id="qSub"></p></div>
      <div class="r">
        <button class="chip" id="qSave"><svg class="ic"><use href="#i-list"/></svg>Save</button>
        <button class="chip" id="qClearBtn"><svg class="ic"><use href="#i-trash"/></svg>Clear</button>
        <button class="rb" data-act="qclose" aria-label="Close queue"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div id="qList" class="rows"></div>
  </div>
</section>

<section id="eq" class="sheet" hidden aria-label="Equalizer">
  <div class="grab" id="eqGrab"><span></span></div>
  <div class="sh-wrap">
    <div class="sh-head">
      <div><h2>Equalizer</h2><p>Shapes the sound inside this player, so it works even when the car's own EQ is locked.</p></div>
      <div class="r">
        <button class="switch" id="eqOn" role="switch" aria-checked="true"><i></i><span id="eqOnTxt">On</span></button>
        <button class="rb" data-act="eqclose" aria-label="Close equalizer"><svg class="ic"><use href="#i-x"/></svg></button>
      </div>
    </div>
    <div class="curve"><canvas id="eqCurve"></canvas></div>
    <div class="presets" id="eqPresets"></div>
    <div class="faders" id="eqFaders"></div>
    <div class="eq-foot"><button class="chip" id="eqReset">Reset to flat</button></div>
  </div>
</section>

<section id="set" class="sheet" hidden aria-label="Settings">
  <div class="grab" id="setGrab"><span></span></div>
  <div class="sh-wrap" id="setBody" style="max-width:760px"></div>
</section>

<div id="scrim" hidden><div id="menu" role="menu"></div></div>
<div id="dlg" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<input type="file" id="fFolder" webkitdirectory multiple hidden>
<input type="file" id="fFiles" accept="audio/*" multiple hidden>

<script src="core.js"></script>
<script src="audio.js"></script>
<script src="views.js"></script>
<script src="player.js"></script>
<script src="fx.js"></script>
<script src="main.js"></script>
</body>
</html>
