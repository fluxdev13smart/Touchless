name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle fonts so the app looks right with no internet
        run: |
          mkdir -p /tmp/fonts && cd /tmp/fonts && npm init -y >/dev/null
          npm i @fontsource-variable/figtree @fontsource/share-tech-mono
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets/www/fonts"
          cp node_modules/@fontsource-variable/figtree/files/figtree-latin-wght-normal.woff2 "$GITHUB_WORKSPACE/app/src/main/assets/www/fonts/"
          cp node_modules/@fontsource/share-tech-mono/files/share-tech-mono-latin-400-normal.woff2 "$GITHUB_WORKSPACE/app/src/main/assets/www/fonts/"
          ls -l "$GITHUB_WORKSPACE/app/src/main/assets/www/fonts"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        run: gradle assembleRelease --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Roadie.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Roadie-apk
          path: Roadie.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Roadie (latest build)
          body: Latest build from the main branch. Download Roadie.apk below, open it on your Android tablet and allow installs from this source.
          files: Roadie.apk
          fail_on_unmatched_files: true
